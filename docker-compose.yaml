services:
    tee:
        build:
            context: .
            dockerfile: Dockerfile
        stdin_open: true
        tty: true
        volumes:
            - /var/run/tappd.sock:/var/run/tappd.sock
            - tee:/app/db.sqlite
            - tee:/app/telegram_account_session/
            - type: bind
              source: .env
              target: /app/.env
        ports:
            - "3123:3000"
        restart: always

volumes:
    tee:
